# ──────────────────────────────────────────────────────────────────────
# CloudBuddy – Docker Compose (Development)
# ──────────────────────────────────────────────────────────────────────
# Spin up both backend and frontend with a single command:
#   docker compose up --build
#
# Or run individually:
#   docker compose up backend
#   docker compose up frontend
# ──────────────────────────────────────────────────────────────────────

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbuddy-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app  # Hot-reload source
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Next.js Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudbuddy-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend/app:/app/app          # Hot-reload pages
      - ./frontend/components:/app/components  # Hot-reload components
      - ./frontend/hooks:/app/hooks      # Hot-reload hooks
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
